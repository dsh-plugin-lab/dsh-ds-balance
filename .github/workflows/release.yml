# 发布：手动触发 + 推 tag，两个等价入口，进的是同一个 job。
#   ① 手动 —— Actions → Release → Run workflow（或 `gh workflow run release.yml`）。
#   ② 推 tag —— `git push origin v<版本>`。
#
# **输入只有 `dry-run`**（本仓还有那个检查链上的选项）；版本号来自 package.json，档位在本地 bump 时定。
#
# 改本文件后**必须手动 dispatch 实跑一次**：PR 上的 CI 只跑 ci.yml，动 release.yml 的 PR
# 就算绿勾也不代表发布链路验过。
#
# 顺序是全有或全无：先发布成功，才打 tag 与建 GitHub Release；发布失败时远端零残留。
#
# 幂等：重跑不会重复发布 —— 目标版本已在 npm 上时跳过 publish，只补齐 git 侧（tag / Release）。
#
# **tag 触发带一道自己的闸**：tag 名必须等于 `v` + package.json 里的版本号，不一致直接红 ——
# 否则会出现「tag 是 v2.3.0、发出去的是 2.2.0」这种最难查的错位，而 npm 的版本号不可覆盖。
# 手动触发没有这道闸（它的语义是「发清单里那个号」，tag 由流程补建）。
#
# **发版说明读 Release Drafter 草稿**（tag `next`），读不到或读空才回落 `--generate-notes`，
# 且**读不到必须发 warning** —— 那是配置坏了，与「本轮没有带标签的 PR」不是一回事。
# 正文取走之后**删掉草稿**，否则下一版会读到这一批的正文。
#
# **版本驱动：本 workflow 不 bump 版本。** 发布的就是 package.json 里那个号 —— 版本号是发布**之前**
# 的独立一步。理由：界面上的版本 tag 就是 package.json 里那个号，workflow 自己 bump 会让工作树
# 永远停在「上一个已发布版本」。这条由 `pnpm run check:release` 的「发布流程不改写版本号」钉住。
#
# 预发布：版本号里带预发布段（2.0.0-alpha.2）时，**按版本自己那段**发到同名 dist-tag（alpha），
# latest 保持不动；不带预发布段时发默认 latest。判据是**结果版本**，不是任何输入参数，
# 所以 publish 与 GitHub Release 两步读同一个输出，不会各判各的。
#
# **tag 名 = v + package.json 里的版本号**（v2.3.1）。前缀是**显式补**的，不从值里推 ——
# `npm version` 的输出自带 v，而 package.json 里没有；换来源时形状变了会把 tag 名带歪，
# 而守卫靠 git describe --match 'v[0-9]*' 看 tag，**它看不见不带 v 的 tag**（2026-09-22 真踩过）。
#
# 防噪音：bump 之前先跑 scripts/release-guard.mjs —— 上个 tag 以来若只剩非产物改动
# （文档 / 测试 / CI / 工具脚本），说明没有可发布的行为变化，直接红。
#
# 认证：npm Trusted Publishing（OIDC），全程不传任何 token。
# npm 自 2027-01 起不再接受 bypass-2FA token 直接发布，故不留长期凭据。
# 代价：在 npmjs.com 上为本包配一次 Trusted Publisher（仓库 / workflow 文件名 / environment 三者要对上）。
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只做检查与打包，不真的发布，也不打 tag
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 在仓库设置里建一个同名 environment，可以给它加人工审批与环境保护规则。
    environment: release
    permissions:
      contents: write # 发布成功后打 tag 用
      id-token: write # Trusted Publishing 的 OIDC 换发
    steps:
      # 手动触发只接受 main；tag 触发天然指向某个提交，由下面那道 tag/清单一致性闸来管。
      # ⚠️ 这道判定**必须带 github.event_name 守卫**：不带的话 tag 触发时 github.ref 是
      # refs/tags/...，每一次 tag 发布都红 —— 而且红的原因离真正的原因很远。
      - name: Verify this dispatch came from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::发版只能从 main 触发，当前 ref 是 ${{ github.ref }}"
          exit 1

      # release-guard 要 diff「上个 tag..HEAD」，浅克隆里没有 tag。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm 必须排在 setup-node 之前，否则 `cache: pnpm` 找不到 store。
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          # Trusted Publishing 要求 npm 走官方 registry 换 OIDC，别指向镜像。
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      # 版本号只写在 package.json 一处：pnpm-lock v9 不记录根包自身的版本，所以 npm 仓那种
      # 「lockfile 版本 == 清单版本」的交叉核对在本仓不存在对应物。「忘了 bump」由下面那道
      # 「该版本已在 npm 上」的幂等判据兜住（报的是已存在，而不是发一个内容相同的新版本出去）。

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # 发布态不变量：dsh.bundle 加回来了吗、private 去掉了没有。
      - name: Release preconditions
        run: pnpm run check:release

      # tag 触发时：tag 名必须就是 v + 清单里的版本号。
      # 没有这道闸就会出现「tag 是 v2.3.0、实际发的是 2.2.0」，而 npm 的版本号不可覆盖。
      - name: Verify the pushed tag matches the manifest version
        if: github.event_name == 'push'
        run: |
          want="v$(node -p "require('./package.json').version")"
          got="${{ github.ref_name }}"
          if [ "$got" != "$want" ]; then
            echo "::error::推的是 $got，而 package.json 是 $want —— tag 与清单版本必须一致"
            exit 1
          fi
          echo "$got 与清单一致，继续。"

      # 产物没变就不该发版 —— 发了等于制造一个内容相同的新版本号。
      # 首次发版还没有任何 tag，这一步自动跳过。
      #
      # 基线要排掉正在发的那个 tag：tag 触发时 HEAD 就是被 tag 的提交，不排除的话
      # `describe` 解析出它自己，`<tag>..HEAD` 恒空 —— 一次完全正常的发布被判成
      # 「没有可发布的内容」。dispatch 触发时 tag 还没建，这个 --exclude 是空操作。
      - name: Release guard
        run: |
          exclude=""
          if [ "${{ github.event_name }}" = "push" ]; then exclude="--exclude=${{ github.ref_name }}"; fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' $exclude 2>/dev/null || true)
          if [ -z "$previous" ]; then
            echo "没有更早的 tag（首次发版），跳过守卫。"
            exit 0
          fi
          echo "对比 $previous..HEAD"
          git diff --name-only "$previous..HEAD" | node scripts/release-guard.mjs

      # 幂等：补跑一条已经发成功的流水线时，不该在 npm 那里撞一个 403 就停住。
      - name: Probe whether this version is already on npm
        id: probe
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version 已经在 npm 上，发布步骤会跳过。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 预发布版本（如 2.0.0-alpha.2）发到它自己的 dist-tag（alpha），**不动 latest**：
      # 这一版要求宿主提供 configForms 客户端服务（下限见 package.json 的 engines.dsh）——
      # 只提「插件用 plugins.bundle.config 槽」会把门槛说低：那个槽在更早的宿主上也在座，
      # 而缺 configForms 时整个浏览器半边都不渲染。旧宿主上配置入口不会出现，
      # 直接推 latest 会让还在旧宿主线上的使用者静默失去配置入口。
      - name: Publish
        if: steps.probe.outputs.exists == 'false'
        run: |
          tag=$(node -e "const v=require('./package.json').version; const p=v.split('-'); process.stdout.write(p.length>1 && /^[A-Za-z]/.test(p[1]) ? p[1].split('.')[0] : 'latest')")
          echo "dist-tag: $tag"
          npm publish --provenance --tag "$tag"${{ inputs.dry-run && ' --dry-run' || '' }}

      # git 侧的发布面：tag + GitHub Release。**两样都由流程产出，不靠人记得去补。**
      # 2026-09-22 之前这里只有 tag：1.0.0 与 1.1.0 的 Release 都是发完手工补建的，
      # 于是「每发一次版都要有人想起这件事」—— 那轮就是这么露出来的。
      # 判据同形（守卫靠 `git describe --match 'v[0-9]*'` 看 tag）：tag 名与标题都带 v 前缀；
      # 版本号带预发布段（如 2.0.0-alpha.2）→ `--prerelease`，正式版不加。
      - name: Tag the release
        if: steps.probe.outputs.exists == 'false' && !inputs.dry-run
        run: |
          tag="v${{ steps.probe.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag 已存在，跳过。"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      # 正文来源两级：**草稿 → `--generate-notes` 回落**。
      #
      # 草稿由 Release Drafter 维护（配置在组织仓，本仓不自带；tag 是滚动名 `next`，
      # 永不与 `v<版本>` 相撞 —— 所以下面那个 `gh release view "$tag"` 的存在性判断不会命中草稿）。
      #
      # **必须断言「草稿真的被读到了吗」**：读不到草稿与「草稿为空」都会走回落，
      # 但前者是**配置坏了**（tag 改名、action 没跑、权限不足），后者是**正常情况**。
      # 不区分的话，「发版成功但正文其实走了回落」是静默失败 —— 与
      # 「npm 发了、Release 页面查不到」同一类：结果看着对，实际少了一层。
      - name: Pick the release body (draft first, then --generate-notes)
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft="$(gh release view next --json body --jq '.body' 2>/dev/null || true)"
          # 用「Release Drafter」这个词判「这是草稿，不是别的什么」：判非空不够稳，
          # 因为一份旧的正式 Release 也是非空的。
          if printf '%s' "$draft" | grep -q 'Release Drafter'; then
            # 清理**按 action 名匹配那一整行**，不抄提示语的全文：那句话归组织仓的模板所有，
            # 随时会被改写。原来这里抄的是中文全文，而模板那句早已改成英文 —— 于是一句都匹配
            # 得上零句，「not published」原样进了正式 Release，而判据仍取子串
            # 「Release Drafter」，所以测试照样绿。这条 sed 就是那次静默失效的现场。
            printf '%s\n' "$draft" | sed '/Release Drafter/d' > /tmp/notes.md
            # 草稿可能只有标题没有条目（无 PR 时）：那种仍算「读到但为空」，走回落。
            if [ -n "$(grep -E '^[-*] ' /tmp/notes.md || true)" ]; then
              echo "source=draft" >> "$GITHUB_OUTPUT"
              echo "::notice::正文来自 Release Drafter 草稿（next）"
            else
              echo "source=generate" >> "$GITHUB_OUTPUT"
              echo "::notice::草稿读到了但没有条目（本版没有带标签的 PR），回落 --generate-notes"
            fi
          else
            echo "source=generate" >> "$GITHUB_OUTPUT"
            echo "::warning::读不到 Release Drafter 草稿（next）—— 回落 --generate-notes。"
            echo "::warning::若是配置坏了（tag 改名 / action 没跑 / 权限不足），这条 warning 就是唯一的信号。"
          fi

      - name: Create the GitHub Release
        if: steps.probe.outputs.exists == 'false' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.probe.outputs.version }}"
          case "${{ steps.probe.outputs.version }}" in
            *-*) flags="--prerelease" ;;
            *)   flags="" ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 的 Release 已存在，跳过。"
          else
            echo "建 Release：$tag $flags（正文来源：${{ steps.notes.outputs.source }}）"
            if [ "${{ steps.notes.outputs.source }}" = "draft" ]; then
              gh release create "$tag" --title "$tag" $flags --notes-file /tmp/notes.md
            else
              gh release create "$tag" --title "$tag" $flags --generate-notes
            fi
          fi

      # 正文取走之后**必须把草稿让位**，否则下一次发版会读到上一批的正文。
      #
      # Release Drafter 以「最新的正式版」作分界线，它自己不认哪个草稿被消费过。
      # 不删的后果不是「草稿空白」，而是**草稿停在旧分界**（实测：某版发版后 `next` 的正文仍停在
      # 那一版之前的那一批）—— 正文是**上一批的**，而表面上看草稿「有内容」，属静默错。
      #
      # `if` 必须与上面 `Create` 那条一致（含 `!inputs.dry-run`）：dry-run 不建任何正式版，
      # 若此时删掉草稿，那批正文就**永久丢了**。且只在正文真的取自草稿时才删 ——
      # 走了回落就不该动它。
      #
      # 只删 tag 不以 `v` 开头的那一个草稿：不按标题匹配，也不碰任何 `v<版本>` 的正式版
      # （`gh release delete <tag>` 默认连带删 tag，这里显式关掉）。
      - name: Retire the drafter's next draft
        if: steps.probe.outputs.exists == 'false' && !inputs.dry-run && steps.notes.outputs.source == 'draft'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft_tag="$(gh release list --limit 30 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft) | .tagName] | map(select(startswith("v") | not)) | .[0] // ""')"
          if [ -n "$draft_tag" ]; then
            gh release delete "$draft_tag" --yes --cleanup-tag=false
            echo "已删除草稿 $draft_tag（下一批合并后 Release Drafter 会重建它）"
          fi
